name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "article/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "article/**"
      - "*.md"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run the poker CLI evaluation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m pip install pokerkit==0.7.7
          python -m scripts.check_poker_import
          python -m scripts.poker_eval "$RUNNER_TEMP/poker-review"
          python -m scripts.check_poker_review > "$RUNNER_TEMP/poker-review/security.json"
          cat "$RUNNER_TEMP/poker-review/evaluation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the poker review evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: poker-review
          path: |
            ${{ runner.temp }}/poker-review/evaluation.md
            ${{ runner.temp }}/poker-review/evaluation.json
            ${{ runner.temp }}/poker-review/security.json
            ${{ runner.temp }}/poker-review/offline/

      - name: Compile
        run: python -m compileall -q corecoder tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: python -m pip install -U pip ruff

      - name: Ruff check
        run: ruff check corecoder tests scripts
